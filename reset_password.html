<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTabTitle">إعادة تعيين كلمة السر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="bg-shapes">
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
</div>

<div class="card-wrapper">
  <div class="card">
    <div class="card-header">
      <div class="logo-icon" style="background:linear-gradient(135deg,#e74c3c,#c0392b)">🔐</div>
      <h1 id="pageTitle">إعادة تعيين كلمة السر</h1>
      <p class="subtitle" id="pageSub">أرسلنا رمزاً إلى</p>
      <p class="email-display">{{ email }}</p>
    </div>

    {% if error %}
    <div class="alert alert-error">
      <span class="alert-icon">⚠</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/reset-password">
      <input type="hidden" name="lang" id="langInput" value="ar">
      <div class="form-group">
        <label id="codeLabel">الرمز المرسل على بريدك</label>
        <input type="text" name="code" id="otpInput"
               placeholder="0 0 0 0 0 0"
               maxlength="6"
               autocomplete="one-time-code"
               style="text-align:center;font-size:1.6rem;letter-spacing:12px;font-weight:700"
               required autofocus>
      </div>

      <div class="form-group">
        <label id="newPassLabel">كلمة السر الجديدة</label>
        <div class="input-action-wrap">
          <input type="password" name="password" id="password"
                 placeholder="أدخل كلمة سر جديدة قوية"
                 id="passInput"
                 required oninput="checkStrength(this.value)">
          <button type="button" class="btn-eye" onclick="togglePass('password',this)">👁</button>
        </div>
        <div class="strength-bar-wrap">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <div class="strength-info">
          <span id="strengthLabel"></span>
        </div>
      </div>

      <div class="form-group">
        <label id="confirmPassLabel">تأكيد كلمة السر الجديدة</label>
        <div class="input-action-wrap">
          <input type="password" name="password2" id="password2"
                 placeholder="أعد كتابة كلمة السر"
                 required>
          <button type="button" class="btn-eye" onclick="togglePass('password2',this)">👁</button>
        </div>
        <span class="field-hint" id="passHint"></span>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn"
              style="background:linear-gradient(135deg,#e74c3c,#c0392b)">
        تغيير كلمة السر
      </button>
    </form>

    <p class="switch-page">
      <a href="/forgot-password" id="resendLink">← إعادة إرسال الرمز</a>
    </p>
  </div>
</div>

<script>
const T = {
  ar: {
    tab: "إعادة تعيين كلمة السر",
    pageTitle: "إعادة تعيين كلمة السر",
    pageSub: "أرسلنا رمزاً إلى",
    codeLabel: "الرمز المرسل على بريدك",
    newPassLabel: "كلمة السر الجديدة",
    newPassPh: "أدخل كلمة سر جديدة قوية",
    confirmPassLabel: "تأكيد كلمة السر الجديدة",
    confirmPassPh: "أعد كتابة كلمة السر",
    submitBtn: "تغيير كلمة السر",
    resendLink: "← إعادة إرسال الرمز",
    matchOk: "✓ كلمتا السر متطابقتان",
    matchNo: "✗ كلمتا السر غير متطابقتين",
  },
  en: {
    tab: "Reset Password",
    pageTitle: "Reset Your Password",
    pageSub: "We sent a code to",
    codeLabel: "Code sent to your email",
    newPassLabel: "New Password",
    newPassPh: "Enter a strong new password",
    confirmPassLabel: "Confirm New Password",
    confirmPassPh: "Re-enter your password",
    submitBtn: "Change Password",
    resendLink: "← Resend Code",
    matchOk: "✓ Passwords match",
    matchNo: "✗ Passwords do not match",
  }
};

const lang = localStorage.getItem('lang') || 'ar';
document.cookie = 'lang=' + lang + ';path=/;max-age=31536000';

function applyLang(l) {
  const t = T[l];
  const root = document.getElementById('htmlRoot');
  root.setAttribute('lang', l);
  root.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('pageTabTitle').textContent    = t.tab;
  document.getElementById('pageTitle').textContent       = t.pageTitle;
  document.getElementById('pageSub').textContent         = t.pageSub;
  document.getElementById('codeLabel').textContent       = t.codeLabel;
  document.getElementById('newPassLabel').textContent    = t.newPassLabel;
  document.getElementById('password').placeholder        = t.newPassPh;
  document.getElementById('confirmPassLabel').textContent = t.confirmPassLabel;
  document.getElementById('password2').placeholder       = t.confirmPassPh;
  document.getElementById('submitBtn').textContent       = t.submitBtn;
  document.getElementById('resendLink').textContent      = t.resendLink;
  const li = document.getElementById('langInput');
  if (li) li.value = l;
}

applyLang(lang);

// OTP digits only
document.getElementById('otpInput').addEventListener('input', function() {
  this.value = this.value.replace(/\D/g,'');
});

// Password match check
document.getElementById('password2').addEventListener('input', function() {
  const hint = document.getElementById('passHint');
  const t = T[lang];
  if (!this.value) { hint.textContent=''; return; }
  if (this.value === document.getElementById('password').value) {
    hint.textContent = t.matchOk;
    hint.style.color = '#2ecc71';
  } else {
    hint.textContent = t.matchNo;
    hint.style.color = '#e74c3c';
  }
});

// Password strength
let strengthTimeout;
async function checkStrength(password) {
  clearTimeout(strengthTimeout);
  if (!password) {
    document.getElementById('strengthBar').style.width='0';
    document.getElementById('strengthLabel').textContent='';
    return;
  }
  strengthTimeout = setTimeout(async () => {
    try {
      const res  = await fetch('/check_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
      const data = await res.json();
      const bar  = document.getElementById('strengthBar');
      bar.style.width      = data.score+'%';
      bar.style.background = data.color;
      document.getElementById('strengthLabel').textContent = data.label;
      document.getElementById('strengthLabel').style.color = data.color;
    } catch(e){}
  }, 400);
}

function togglePass(id, btn) {
  const inp = document.getElementById(id);
  inp.type  = inp.type==='password'?'text':'password';
  btn.textContent = inp.type==='password'?'👁':'🙈';
}
</script>
</body>
</html>
