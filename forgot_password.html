<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTabTitle">نسيت كلمة السر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="bg-shapes">
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
</div>

<div class="card-wrapper">
  <div class="card">
    <div class="card-header">
      <div class="logo-icon" style="background:linear-gradient(135deg,#e74c3c,#c0392b)">🔑</div>
      <h1 id="pageTitle">نسيت كلمة السر؟</h1>
      <p class="subtitle" id="pageSub">أدخل بريدك وهنبعتلك رمز لإعادة التعيين</p>
    </div>

    {% if error %}
    <div class="alert alert-error">
      <span class="alert-icon">⚠</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/forgot-password">
      <input type="hidden" name="lang" id="langInput" value="ar">
      <div class="form-group">
        <label id="emailLabel">البريد الإلكتروني المسجّل</label>
        <input type="email" name="email" placeholder="example@email.com" required autofocus>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn"
              style="background:linear-gradient(135deg,#e74c3c,#c0392b)">
        إرسال رمز التعيين
      </button>
    </form>

    <p class="switch-page">
      <a href="/login" id="backLink">← العودة لتسجيل الدخول</a>
    </p>
  </div>
</div>

<script>
const T = {
  ar: {
    tab: "نسيت كلمة السر",
    pageTitle: "نسيت كلمة السر؟",
    pageSub: "أدخل بريدك وهنبعتلك رمز لإعادة التعيين",
    emailLabel: "البريد الإلكتروني المسجّل",
    submitBtn: "إرسال رمز التعيين",
    backLink: "← العودة لتسجيل الدخول",
  },
  en: {
    tab: "Forgot Password",
    pageTitle: "Forgot Your Password?",
    pageSub: "Enter your email and we'll send you a reset code",
    emailLabel: "Registered Email Address",
    submitBtn: "Send Reset Code",
    backLink: "← Back to Sign In",
  }
};

function applyLang(l) {
  const t = T[l];
  const root = document.getElementById('htmlRoot');
  root.setAttribute('lang', l);
  root.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('pageTabTitle').textContent = t.tab;
  document.getElementById('pageTitle').textContent    = t.pageTitle;
  document.getElementById('pageSub').textContent      = t.pageSub;
  document.getElementById('emailLabel').textContent   = t.emailLabel;
  document.getElementById('submitBtn').textContent    = t.submitBtn;
  document.getElementById('backLink').textContent     = t.backLink;
  const li = document.getElementById('langInput');
  if (li) li.value = l;
}

const lang = localStorage.getItem('lang') || 'ar';
document.cookie = 'lang=' + lang + ';path=/;max-age=31536000';
applyLang(lang);
</script>
</body>
</html>
